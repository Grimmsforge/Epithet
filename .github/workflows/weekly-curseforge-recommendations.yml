name: Weekly CurseForge Recommendations

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore recommendation history cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/curseforge-recommender/history.json
          key: curseforge-recommender-history-v1-${{ github.run_id }}
          restore-keys: |
            curseforge-recommender-history-v1-

      - name: Generate weekly recommendations
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_API_URL: ${{ vars.CURSEFORGE_API_URL }}
          CURSEFORGE_FALLBACK_FEEDS: ${{ vars.CURSEFORGE_FALLBACK_FEEDS }}
        run: |
          ./scripts/automation/curseforge-weekly-recommendations.ps1 `
            -OutputDir ./artifacts/curseforge-recommendations `
            -HistoryPath ./.cache/curseforge-recommender/history.json `
            -WindowDays 7 `
            -MaxAddons 20

      - name: Upload recommendation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-curseforge-recommendations
          path: artifacts/curseforge-recommendations/
          if-no-files-found: error

      - name: Upsert rolling recommendation issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/curseforge-recommendations/issue-body.md';
            const marker = '<!-- epithet-weekly-curseforge-recommendations -->';
            const title = 'Weekly CurseForge feature recommendations';
            const body = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find((issue) =>
              issue.title === title || (issue.body || '').includes(marker)
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['enhancement']
              });
              core.info(`Created issue #${created.data.number}`);
            }

      - name: Save recommendation history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/curseforge-recommender/history.json
          key: curseforge-recommender-history-v1-${{ github.run_id }}
